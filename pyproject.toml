[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genmodelfit"
dynamic = ["version"]  # 正本は src/genmodelfit/_version.py
description = "Right-size image / video / audio / 3D generation models to your PC (inspired by llmfit)."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Laxshmate", email = "laxshmate@gmail.com" }]
requires-python = ">=3.10"
keywords = ["comfyui", "diffusion", "vram", "stable-diffusion", "video-generation", "hardware", "llmfit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# 依存は MIT / Apache-2.0 / BSD のものだけ(例外は requests 経由の certifi の MPL-2.0。CLAUDE.md)
dependencies = [
  "requests>=2.31",      # Apache-2.0
  "psutil>=5.9",         # BSD-3-Clause
  "platformdirs>=4.0",   # MIT
  "rich>=13.0",          # MIT
  "cryptography>=42",   # Apache-2.0 OR BSD-3-Clause(データの署名の検証。安全に関わるので必須)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyyaml>=6"]  # pytest-cov は MIT

[project.scripts]
genmodelfit = "genmodelfit.cli:main"

[project.urls]
Homepage = "https://github.com/laxshmate/genmodelfit"
Issues = "https://github.com/laxshmate/genmodelfit/issues"
Changelog = "https://github.com/laxshmate/genmodelfit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/laxshmate/genmodelfit/blob/main/docs/README.md"

[tool.hatch.version]
path = "src/genmodelfit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genmodelfit"]

# CLAUDE.md(開発の決まり)・.github は配らない。LICENSE と THIRD_PARTY_NOTICES は license-files で入る
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "README.ja.md", "CHANGELOG.md", "CONTRIBUTING.md", "CONTRIBUTING.ja.md", "LICENSE", "THIRD_PARTY_NOTICES"]
exclude = ["__pycache__", "*.pyc", "docs/images"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 日本語の全角文字を許す

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 実ネットワークに触るテスト(既定では飛ばす。GENMODELFIT_NETWORK_TESTS=1 で実行)"]
