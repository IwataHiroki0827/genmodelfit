# 実測の提出(#113)。genmodelfit share がこのフォームを、中身(submission の欄)を入れて開く。
# 受け取るのは .github/workflows/measurement-intake.yml(measurement の印の Issue だけ)。欄の id(submission)・
# 印(measurement)を変えたら src/genmodelfit/contrib.py の ISSUE_FIELD・ISSUE_LABEL も直す。
# 「Create」を 1 回押すだけで送れるように、必須のチェックボックスなどは置かない(tests/test_contrib.py)
name: "Send a measurement / 実測を送る"
description: >-
  Send a measurement made with genmodelfit share or measure, without signing in. genmodelfit share --issue fills this in for you.
  genmodelfit share・measure で測った結果を、ログインせずに送ります。genmodelfit share --issue が中身を入れてくれます。
title: "measurement: "
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you! Just press "Create" at the bottom.

        - **Already filled in.** `genmodelfit share` put your measurement in the box below. You do not need to change anything.
        - **What is in it:** the GPU name, its memory (VRAM), generation and compute capability (NVIDIA), driver version, vendor and backend, the PCI model ID for AMD / Intel (a model number, the same on every card of that model), the kind of OS (Windows / Linux / macOS), the amount of RAM (rounded), the ComfyUI and genmodelfit versions, the date (no time), the model, the settings, the result, the measured numbers (peak memory, time), how the model was loaded, a fingerprint of the model files, and a short note about how it was measured. Since 0.13.0 also genmodelfit's estimate for it, a time breakdown, a mark when the peak VRAM spilled into shared memory, and the model list version. A failure record holds the model, the kind of failure, missing node names and the error's type name.
        - **What is not in it:** your PC name, user name, folder paths, serial numbers, the GPU's unique ID or slot, IP address, prompts or error message text. `genmodelfit share` checked this before opening this page.
        - **What happens next:** a bot checks it within a few minutes and replies here. If it is fine, the bot adds it to the project and a maintainer merges it; if something is wrong, the bot says what to fix (edit this issue to send it again). Changes after the bot made its pull request: just edit this issue; the bot checks the new content and updates (or closes) the pull request.
        - The box is empty? Paste the content that `genmodelfit share` copied to your clipboard (Ctrl+V / Cmd+V).

        ---

        ### ありがとうございます。下の「Create」を押すだけです。

        - **入力済みです。** `genmodelfit share` が下の欄に実測を入れました。変える必要はありません。
        - **入っているもの:** GPU の名前・メモリ(VRAM)・世代と compute capability(NVIDIA)・ドライバの版・会社と backend、AMD・Intel では PCI の型番 ID(機種の番号。同じ機種ならどのカードでも同じ)、OS の種類(Windows / Linux / macOS)、メモリの量(丸めたもの)、ComfyUI と genmodelfit の版、日付(時刻は入れない)、モデル、設定、結果、測った値(メモリの最大・時間)、モデルの載せ方、モデルのファイルの指紋、測り方の短いメモ。0.13.0 からは、それに対する genmodelfit の見積もり・時間の内訳・最大 VRAM が共有メモリに逃げた印・一覧の版も入ります。失敗の記録には、モデル・失敗の種類・足りないノードの名前・エラーの種類の名前が入ります。
        - **入っていないもの:** PC の名前、ユーザ名、フォルダの場所、シリアル番号、GPU の固有の ID や差し場所、IP アドレス、プロンプト、エラーの本文。このページを開く前に `genmodelfit share` が確かめています。
        - **このあと:** 数分でボットが確かめて、ここに返事を書きます。問題が無ければボットがプロジェクトに足し、メンテナがマージします。直すところがあれば、ボットが何を直すかを書きます(この Issue を編集すると、もう一度送れます)。PR ができたあとの変更も、この Issue を編集するだけです。ボットが新しい中身で確かめて、PR を直します(通らなければ閉じます)。
        - 欄が空のときは、`genmodelfit share` がクリップボードに写した中身を貼り付けてください(Ctrl+V / Cmd+V)。
  - type: textarea
    id: submission
    attributes:
      label: "Measurement (JSON)"
      description: >-
        Filled in by genmodelfit share — no need to edit. / genmodelfit share が入れた中身です(直す必要はありません)。
      render: json
    validations:
      required: true
