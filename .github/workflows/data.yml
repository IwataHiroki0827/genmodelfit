name: Data

# main にコミットされた一覧(src/genmodelfit/data/db.json)に署名して、ローリングの Release(data-latest)に置く。
# 上流から作り直さない(作り直して PR にする流れは Issue #19)。PyPI への公開は動かない(v* のタグではない)。
# 使う側は `genmodelfit update --from-release`。手順と鍵の扱いは docs/release.md。
#
# きっかけ: 手動実行と、main の db.json が変わった push。
# 秘密鍵は environment `data-signing`(main からの実行だけ使える)のシークレットで、署名の 1 ステップにだけ渡す。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/genmodelfit/data/db.json

permissions:
  contents: read

concurrency:
  group: data-latest
  cancel-in-progress: false

jobs:
  sign:
    # main 以外(手動実行でブランチを選んだとき)は動かさない。environment の側でも main に限っている
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: data-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e .
      - name: コミットされた一覧を確かめる
        run: |
          mkdir -p dist-data
          cp src/genmodelfit/data/db.json dist-data/db.json
          # 確認待ち(review: pending)の項目は配らない。0.5.x は review を知らず自動のおすすめに出してしまうため(#42)
          uv run --no-sync python -m genmodelfit.review publish dist-data/db.json dist-data/db.json
          uv run --no-sync python -c "from genmodelfit.db import load; db = load('dist-data/db.json'); print(len(db.models), db.generated_at)"
          uv run --no-sync genmodelfit system --json --db dist-data/db.json --vram 8 --ram 32 > /dev/null
      - name: 署名する
        env:
          GENMODELFIT_SIGNING_KEY: ${{ secrets.GENMODELFIT_SIGNING_KEY }}
        run: uv run --no-sync python -m genmodelfit.signing sign dist-data/db.json
      - name: 同梱の公開鍵で確かめる
        run: uv run --no-sync python -m genmodelfit.signing verify dist-data/db.json
      - uses: actions/upload-artifact@v4
        with:
          name: db-signed
          path: |
            dist-data/db.json
            dist-data/db.json.sig
          if-no-files-found: error

  upload:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: db-signed
          path: dist-data/
      - name: data-latest に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create data-latest --repo "${GITHUB_REPOSITORY}" --prerelease \
              --title "data-latest" --notes "署名つきのモデル一覧。genmodelfit update --from-release が取り込む。"
          fi
          gh release upload data-latest dist-data/db.json dist-data/db.json.sig --clobber --repo "${GITHUB_REPOSITORY}"

  # 配った直後に、まっさらな環境で本当に取り込めるかを確かめる(署名・形式・期限)。
  # main のコードと、アプリ(AI生成キット)が固定している版の両方で確かめる
  verify:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        client: ["main", "genmodelfit==0.5.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: まっさらな環境に入れる
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          uv venv "$RUNNER_TEMP/v"
          if [ "$CLIENT" = "main" ]; then
            uv pip install --python "$RUNNER_TEMP/v/bin/python" .
          else
            uv pip install --python "$RUNNER_TEMP/v/bin/python" "$CLIENT"
          fi
      - name: data-latest を取り込む
        env:
          GENMODELFIT_CACHE_DIR: ${{ runner.temp }}/cache
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v/bin/genmodelfit" --version
          "$RUNNER_TEMP/v/bin/genmodelfit" update --from-release
          "$RUNNER_TEMP/v/bin/python" - <<'PY'
          import genmodelfit as g
          s = g.data_status()
          print(s)
          assert s.source == "release", s.source
          assert not s.expired, "取り込んだ一覧の HEAD の確認が期限切れ"
          assert s.models > 100, s.models
          assert s.auto_count > 0, s.auto_count
          PY
