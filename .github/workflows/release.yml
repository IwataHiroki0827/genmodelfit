name: Release

# v* のタグを push すると、テスト → ビルド → PyPI へ公開 → GitHub Release の順に進む。
# 公開は environment pypi の承認(ユーザ)を待ってから。pypi は v* のタグからしか使えない。
# 手動実行(workflow_dispatch)はビルドまでで、タグを選んで手動実行しても公開しない(event_name で弾く)。
# 手順は docs/release.md。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: タグと版が合うか確かめる
        # 版の正本は src/genmodelfit/_version.py(pyproject は hatch がそこから読む)。作った dist の名前でも確かめる
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/genmodelfit/_version.py)
          echo "tag=${GITHUB_REF_NAME} _version.py=${ver}"
          ls dist
          test -n "${ver}" || { echo "::error::_version.py から版を読めません"; exit 1; }
          test "${GITHUB_REF_NAME}" = "v${ver}" || { echo "::error::タグと _version.py の版が違います"; exit 1; }
          test -f "dist/genmodelfit-${ver}-py3-none-any.whl" || { echo "::error::wheel の版が違います"; exit 1; }
          test -f "dist/genmodelfit-${ver}.tar.gz" || { echo "::error::sdist の版が違います"; exit 1; }
      - name: Check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # タグを push したときだけ(手動実行では動かない)。API トークンは使わない(PyPI の Trusted Publishing)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
