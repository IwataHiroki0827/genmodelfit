name: CI

# 全試験は手元で tools/ci_local.py を通してから push する(2026-10-22 オーナー決定)。ここは確認用:
# - main へのマージの後(push)と手動実行
# - 外の人のフォークからの PR(外のコードを手元で動かさないため)。このリポジトリのブランチの PR では動かさない
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行を止める。main への push は止めない(マージごとの結果を残す)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Python 3.10〜3.13 × Ubuntu / Windows。ruff と網羅率は 3.12 だけ(時間を節約する)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Lint
        if: matrix.python == '3.12'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test (coverage)
        # 網羅率は表示だけ(下限はまだ決めない)
        if: matrix.python == '3.12'
        run: uv run --no-sync pytest -q --cov=genmodelfit --cov-report=term
      - name: Test
        if: matrix.python != '3.12'
        run: uv run --no-sync pytest -q
      - name: CLI smoke
        run: |
          uv run --no-sync genmodelfit system --json --vram 8 --ram 32
          uv run --no-sync genmodelfit recommend --json --vram 8 --ram 32 --no-cache -n 3
          uv run --no-sync genmodelfit fit --vram 16 --ram 32 --no-cache

  # wheel と sdist を作り、dev 依存の無いまっさらな venv に wheel を入れて、利用者と同じ形で主なコマンドを通す
  wheel:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: uv build --out-dir dist
      - name: Check dist
        run: |
          set -euo pipefail
          uvx twine check --strict dist/*
          uv run --no-project --python ${{ matrix.python }} python tools/check_dist.py dist
      - name: Install into a fresh venv
        run: |
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv --python ${{ matrix.python }} "$venv"
          if [ -d "$venv/Scripts" ]; then bin="$venv/Scripts"; py="$bin/python.exe"; else bin="$venv/bin"; py="$bin/python"; fi
          uv pip install --python "$py" dist/*.whl
          echo "$bin" >> "$GITHUB_PATH"
      - name: Commands
        working-directory: ${{ runner.temp }}
        env:
          GENMODELFIT_CACHE_DIR: ${{ runner.temp }}/gmf-cache
        run: |
          set -euo pipefail
          genmodelfit --version
          genmodelfit system --json > /dev/null
          genmodelfit system --vram 8 --ram 32
          genmodelfit recommend --json --vram 8 --ram 32 --no-cache -n 3 > /dev/null
          genmodelfit fit --vram 16 --ram 32 --no-cache
          genmodelfit info image_z_image_turbo_int8 --vram 8 --ram 32
          python -c "import genmodelfit as g; print(len(g.recommend(limit=3)), g.data_status().to_dict())"
          # dev の依存(pytest など)が入っていないこと
          if python -c "import pytest" 2>/dev/null; then echo "pytest が入っている" >&2; exit 1; fi
