name: Measurement intake

# 実測の Issue(.github/ISSUE_TEMPLATE/measurement.yml。genmodelfit share が開く。#113)を受け取る。
# 検査を通れば data/contrib/<GPU>/<日付>-<sha8>.json を足す PR を作り(マージはメンテナ)、通らなければ理由を
# Issue にコメントする。検査の中身は contrib validate と同じ(genmodelfit contrib intake → contrib.intake_issue)。
# 手順と設定: docs/release.md「実測の Issue を受け取る(#113)」
#
# 2 つのジョブに分ける:
# - check: 読むだけの権限。genmodelfit を入れて Issue の本文を検査し、結果のファイルを artifact にする
#   (git の履歴をすべて取り、同じ人が同じ GPU・モデルで前に送った数も数える)
# - publish: 書く権限(contents・pull-requests・issues)。ほかの人のパッケージは入れない(git と gh だけ)。
#   artifact のファイルで branch・PR・コメントを作る
#
# 安全のため:
# - Issue の本文は**データとしてだけ**扱う。${{ }} で run: に埋め込まない(本文・題・アカウント名は一度も
#   ワークフローの式に入れない)。genmodelfit contrib intake がイベントのファイル(GITHUB_EVENT_PATH)から読み、
#   JSON として検査して、書き直した中身をファイルに書く。シェルに渡すのは検査を通った決まった形の値だけ
#   (置き場所 data/contrib/<GPU>/<日付>-<sha8>.json は publish でも形を確かめる)
# - 検査の道具は既定のブランチ(issues のイベントはいつも既定のブランチのワークフローとコードで動く)
# - 提出から来る文字はログに出さない(contrib intake は件数だけを出す。その間はワークフローのコマンドを止める)。
#   コメント・PR の本文の理由の文は contrib.md_cell で無害にしてある
# - シークレットは使わない(GITHUB_TOKEN だけ)。actions はコミットの SHA で固定する。checkout は資格情報を残さない
# - GITHUB_TOKEN で作った PR では contrib.yml は動かない(GitHub の決まり)。同じ検査を check でしている
#
# 何度動いても同じになるように:
# - 動くのは Issue を作ったときと、本文を変えたとき(題だけの編集では動かない)。印を付けたときは動かない
#   (フォームの Issue は作ったときに印が付いているので、同じ Issue で 2 回動かないように)
# - この Issue の PR が同じ中身を持っていれば、push もコメントもしない
# - 同じ中身が別の Issue の PR にあれば、PR を作らずにその PR を知らせる
# - PR ができたあとに本文が変わったら: 通る中身なら PR を直し、PR と Issue に知らせる。通らない中身(か、別の
#   Issue の PR と同じ中身)なら PR と Issue に理由を書き、印 measurement-invalid を付けて PR を閉じる。
#   直ったら、この印のある PR だけを開き直す(メンテナが閉じた PR は開き直さない)
# - 同じ理由で断るコメントは 1 回だけ(前のボットのコメントの最後の隠した印が同じなら書かない)
# - 見る PR はボットの PR だけ(isCrossRepository が偽で、作者が GitHub Actions)。フォークの同じ名前のブランチは見ない
# - 実測の PR は「Create a merge commit」で入れる(squash・rebase はしない)。出どころの数え方がマージのコミットを
#   見るため(contrib.submission_origins)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: measurement-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'measurement') &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e .
      - name: 検査(contrib intake)
        env:
          OUT: ${{ runner.temp }}/intake
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          uv run --no-sync genmodelfit --lang en contrib intake "$GITHUB_EVENT_PATH" --existing data/contrib --out "$OUT"
          echo "::${token}::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intake
          path: ${{ runner.temp }}/intake
          retention-days: 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intake
          path: ${{ runner.temp }}/intake
      - name: PR を作る・直す・閉じる、Issue にコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
          OUT: ${{ runner.temp }}/intake
        run: |
          set -euo pipefail
          branch="measurement/issue-${ISSUE}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          invalid="measurement-invalid"
          # ボットが作った PR だけを見る(フォークの PR は同じ名前のブランチでも除く)。gh は GitHub Actions の
          # アプリの作者を app/github-actions と返す(古い版は github-actions[bot])
          bot='(.isCrossRepository | not) and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]")'
          bot_prs() {  # $1 ブランチ(空ならすべて) $2 状態 $3 jq の続き
            local head=()
            [ -n "$1" ] && head=(--head "$1")
            gh pr list "${head[@]}" --state "$2" --limit 200 \
              --json url,number,headRefName,isCrossRepository,author,labels,mergedAt \
              --jq "[.[] | select(${bot})] | $3"
          }
          comment_issue() {  # $1 本文 $2 隠した印。ボットの前のコメントに同じ印があれば書かない(同じ知らせを繰り返さない)
            last="$(gh issue view "$ISSUE" --json comments --jq \
              '[.comments[] | select(.author.login == "github-actions" or .author.login == "app/github-actions" or .author.login == "github-actions[bot]")] | last | .body // ""')"
            if [ -n "$2" ] && printf '%s' "$last" | grep -qF -- "$2"; then
              echo "same notice as before"
              return 0
            fi
            gh issue comment "$ISSUE" --body-file "$1"
          }
          close_invalid() {  # ボットが閉じた印を付けて閉じる(印のある PR だけ、あとで開き直す)
            gh label create "$invalid" --color d93f0b \
              --description "Closed by measurement-intake; reopened when the issue is fixed" --force >/dev/null || true
            gh pr edit "$1" --add-label "$invalid"
            gh pr close "$1" --comment "$(cat "$2")"
          }
          pr="$(bot_prs "$branch" open '.[0].url // ""')"
          if [ ! -f "$OUT/path.txt" ]; then
            # 通らない中身: Issue に理由を書く。PR があれば PR にも書いて閉じる(Issue を直すと開き直す)
            comment_issue "$OUT/comment.md" "$(head -n 1 "$OUT/marker.txt")"  # 印は断った理由の組の hash
            if [ -n "$pr" ]; then
              close_invalid "$pr" "$OUT/comment_pr_closed.md"
            fi
            exit 0
          fi
          path="$(head -n 1 "$OUT/path.txt")"
          if ! printf '%s\n' "$path" | grep -Eq '^data/contrib/[a-z0-9-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}\.json$'; then
            echo "unexpected path" >&2
            exit 1
          fi
          want="$(sha256sum < "$OUT/submission.json" | cut -d' ' -f1)"
          # この Issue の PR が同じ中身を持っていれば何もしない(作ったときと同じ中身など)
          if [ -n "$pr" ] && git fetch -q --depth 1 "$remote" "refs/heads/${branch}" 2>/dev/null \
              && have="$(git show "FETCH_HEAD:${path}" 2>/dev/null | sha256sum | cut -d' ' -f1)" \
              && [ "$have" = "$want" ]; then
            echo "unchanged"
            exit 0
          fi
          # 同じ中身(置き場所の名前は中身の hash)が、別の Issue のボットの PR にあれば知らせて止める。
          # この Issue の PR が開いていれば、古い中身のままなので閉じる
          others="$(bot_prs "" open '.[].headRefName' | grep -E '^measurement/issue-[0-9]+$' || true)"
          for b in $others; do
            [ "$b" = "$branch" ] && continue
            if git fetch -q --depth 1 "$remote" "refs/heads/${b}" 2>/dev/null \
                && git cat-file -e "FETCH_HEAD:${path}" 2>/dev/null; then
              url="$(bot_prs "$b" open '.[0].url // ""')"
              mark="<!-- measurement-intake:duplicate=${want:0:16} -->"
              printf 'The same measurement was already sent: %s\n\n---\n\n同じ実測は既に送られています: %s\n\n%s\n' \
                "$url" "$url" "$mark" > "$OUT/dup.md"
              comment_issue "$OUT/dup.md" "$mark"
              if [ -n "$pr" ]; then
                close_invalid "$pr" "$OUT/dup.md"
              fi
              exit 0
            fi
          done
          if [ -z "$pr" ]; then
            # ボットが(通らない中身で)閉じた PR だけを開き直す。メンテナが閉じた PR(印が無い)は開き直さない。
            # GitHub は push のあとでは開き直せないので先に
            closed="$(bot_prs "$branch" closed \
              "[.[] | select(.mergedAt == null and (.labels | map(.name) | index(\"${invalid}\")))][0].url // \"\"")"
            if [ -n "$closed" ]; then
              gh pr edit "$closed" --remove-label "$invalid"
              if gh pr reopen "$closed"; then
                pr="$closed"
              else
                # 開き直せない(ブランチが消された・作り直されたなど): 下で新しい PR を作る
                echo "could not reopen ${closed}; opening a new PR" >&2
              fi
            elif [ -n "$(bot_prs "$branch" closed '[.[] | select(.mergedAt == null)][0].url // ""')" ]; then
              echo "a maintainer closed this issue's PR; not reopening" >&2
              mark="<!-- measurement-intake:maintainer-closed -->"
              printf 'A maintainer closed the earlier pull request for this issue, so the bot does not open a new one. Please reply here if it should be looked at again.\n\n---\n\nこの Issue の前の Pull Request はメンテナが閉じたので、ボットは新しく作りません。もう一度見てほしいときは、ここに返信してください。\n\n%s\n' "$mark" > "$OUT/maint.md"
              comment_issue "$OUT/maint.md" "$mark"
              exit 0
            fi
          fi
          git switch -c "$branch"
          mkdir -p "$(dirname "$path")"
          cp "$OUT/submission.json" "$path"
          git add -- "$path"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F "$OUT/commit_msg.txt"
          git push -q --force "$remote" "HEAD:refs/heads/${branch}"
          title="$(head -n 1 "$OUT/title.txt")"
          if [ -n "$pr" ]; then
            # PR ができたあとに中身が変わった: PR を直し、PR と Issue に知らせる
            gh pr edit "$pr" --title "$title" --body-file "$OUT/pr_body.md"
            gh pr comment "$pr" --body-file "$OUT/comment_updated.md"
            printf '\nPR: %s\n' "$pr" >> "$OUT/comment_updated.md"
            gh issue comment "$ISSUE" --body-file "$OUT/comment_updated.md"
            exit 0
          fi
          pr="$(gh pr create --head "$branch" --base "$BASE" --title "$title" --body-file "$OUT/pr_body.md")"
          printf '\nPR: %s\n' "$pr" >> "$OUT/comment.md"
          gh issue comment "$ISSUE" --body-file "$OUT/comment.md"
