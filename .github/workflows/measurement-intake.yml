name: Measurement intake

# 実測の Issue(.github/ISSUE_TEMPLATE/measurement.yml。genmodelfit share が開く。#113)を受け取る。
# 検査を通れば data/contrib/<GPU>/<日付>-<sha8>.json を足す PR を作り(マージはメンテナ)、通らなければ理由を
# Issue にコメントする。検査の中身は contrib validate と同じ(genmodelfit contrib intake → contrib.intake_issue)。
#
# 安全のため:
# - Issue の本文は**データとしてだけ**扱う。${{ }} で run: に埋め込まない(本文・題・アカウント名は一度も
#   ワークフローの式に入れない)。genmodelfit contrib intake がイベントのファイル(GITHUB_EVENT_PATH)から読み、
#   JSON として検査して、書き直した中身をファイルに書く。シェルに渡すのは検査を通った決まった形の値だけ
#   (置き場所 data/contrib/<GPU>/<日付>-<sha8>.json はここでも形を確かめる)
# - 検査の道具は既定のブランチ(issues のイベントはいつも既定のブランチのワークフローとコードで動く)
# - 提出から来る文字はログに出さない(contrib intake は件数だけを出す。その間はワークフローのコマンドを止める)。
#   コメント・PR の本文の理由の文は contrib.md_cell で無害にしてある
# - 書く権限はこのジョブだけ(contents・pull-requests・issues)。シークレットは使わない(GITHUB_TOKEN だけ)
# - actions はコミットの SHA で固定する。checkout は資格情報を残さない(push は GITHUB_TOKEN を明示して 1 回)
# - GITHUB_TOKEN で作った PR では contrib.yml は動かない(GitHub の決まり)。同じ検査をここでしている
# - 出どころの数え方は PR で出した提出と同じ(Issue ごとに 1 つの PR = 1 つのマージのコミット)。
#   PR の本文とコミットに Issue の番号と書いた人のアカウントを書く
# - 使うには、リポジトリの設定で「Allow GitHub Actions to create and approve pull requests」を有効にし、
#   measurement の印(label)を作っておく(docs/release.md「実測の Issue を受け取る(#113)」)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read

concurrency:
  group: measurement-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'measurement') &&
      (github.event.action != 'labeled' || github.event.label.name == 'measurement')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e .
      - name: 検査(contrib intake)
        env:
          OUT: ${{ runner.temp }}/intake
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          uv run --no-sync genmodelfit --lang en contrib intake "$GITHUB_EVENT_PATH" --existing data/contrib --out "$OUT"
          echo "::${token}::"
      - name: PR を作る・Issue にコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
          OUT: ${{ runner.temp }}/intake
        run: |
          set -euo pipefail
          if [ -f "$OUT/path.txt" ]; then
            path="$(head -n 1 "$OUT/path.txt")"
            if ! printf '%s\n' "$path" | grep -Eq '^data/contrib/[a-z0-9-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}\.json$'; then
              echo "unexpected path" >&2
              exit 1
            fi
            branch="measurement/issue-${ISSUE}"
            git switch -c "$branch"
            mkdir -p "$(dirname "$path")"
            cp "$OUT/submission.json" "$path"
            git add -- "$path"
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F "$OUT/commit_msg.txt"
            git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/${branch}"
            pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')"
            if [ -z "$pr" ]; then
              pr="$(gh pr create --head "$branch" --base "$BASE" --title "$(head -n 1 "$OUT/title.txt")" \
                --body-file "$OUT/pr_body.md")"
            fi
            printf '\nPR: %s\n' "$pr" >> "$OUT/comment.md"
          fi
          gh issue comment "$ISSUE" --body-file "$OUT/comment.md"
