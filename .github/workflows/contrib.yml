name: Contrib

# 利用者が出す実測(data/contrib/**、#34)の PR を検査し、結果をジョブのまとめ(Job summary)に出す。
# llmfit の community-benchmarks.yml に当たる。手順は CONTRIBUTING.md、検査の中身は docs/schema.md「contrib」。
#
# 安全のため:
# - pull_request(pull_request_target ではない)。フォークからの PR でもトークンは読むだけで、シークレットは渡らない
# - 検査に使う genmodelfit は PR の側ではなく、PR の向き先(base)のコミットから入れる
#   (PR で検査のコードを書き換えて通すことができないように)。PR の側からは data/contrib だけを読む
# - data/contrib の外を変えた PR は失敗にする(実測の PR とコードの PR を混ぜない)
# - 人が確かめた提出の一覧(data/contrib/REVIEWED)は PR の向き先のものを使い、PR で変えたら失敗にする
#   (提出した人が自分の提出を「確かめた」にできないように。書くのは作者だけ)
# - 提出から来る文字はログ(標準出力)に出さない。Markdown はジョブのまとめにだけ書き(表のマスは
#   contrib.md_cell で無害にしてある)、genmodelfit の出力の間はワークフローのコマンド(::error:: など)を止める
# - genmodelfit の標準エラーも、無害にしてからまとめに書く(失敗の理由が分かるように)
# - actions はコミットの SHA で固定する
# - PR へのコメントは書かない(書き込みの権限を持たない)

on:
  pull_request:
    paths:
      - data/contrib/**

permissions:
  contents: read

env:
  # 標準エラー(最後の 50 行)を無害にして(contrib.md_cell)まとめに書く小さな台本
  SHOW_ERR: >-
    import sys; from genmodelfit.contrib import md_cell;
    lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()[-50:];
    print(("#### stderr" + chr(10) + chr(10) + "<br>".join(md_cell(x) for x in lines)) if lines else "")

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 検査の道具(PR の向き先のコミット)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false
      - name: PR の中身(data/contrib だけを使う)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pr
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install
        working-directory: tool
        run: |
          uv venv
          uv pip install -e .
      - name: data/contrib の外・REVIEWED を変えていないか
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          n=$(git diff --name-only "$BASE_SHA" HEAD -- . ':(exclude)data/contrib/**' | wc -l)
          if [ "$n" -ne 0 ]; then
            {
              echo "## data/contrib の外のファイルも変えています(${n} 件)"
              echo
              echo "実測の PR は data/contrib/ の下だけにしてください(コードの変更は別の PR に)。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "data/contrib の外のファイルを ${n} 件変えています(実測の PR は data/contrib だけにしてください)" >&2
            exit 1
          fi
          if [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- data/contrib/REVIEWED)" ]; then
            echo "## data/contrib/REVIEWED は作者だけが変えます(提出の PR では変えないでください)" >> "$GITHUB_STEP_SUMMARY"
            echo "data/contrib/REVIEWED を変えています" >&2
            exit 1
          fi
      - name: 検査(contrib validate)
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          set +e
          uv run --no-sync --project tool genmodelfit contrib validate pr/data/contrib --markdown \
            --reviewed tool/data/contrib/REVIEWED >> "$GITHUB_STEP_SUMMARY" 2> validate.err
          code=$?
          uv run --no-sync --project tool python -I -c "$SHOW_ERR" validate.err >> "$GITHUB_STEP_SUMMARY"
          set -e
          echo "::${token}::"
          echo "contrib validate: exit ${code}(結果はジョブのまとめ)"
          exit $code
      - name: まとめと精度の点検(contrib aggregate --report)
        if: always()
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          {
            echo
            uv run --no-sync --project tool genmodelfit contrib aggregate pr/data/contrib --report \
              --reviewed tool/data/contrib/REVIEWED || true
          } >> "$GITHUB_STEP_SUMMARY" 2> aggregate.err
          uv run --no-sync --project tool python -I -c "$SHOW_ERR" aggregate.err >> "$GITHUB_STEP_SUMMARY" || true
          echo "::${token}::"
